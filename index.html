<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Philosophy Compass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: questionnaire column on the left, a sticky "star chart" of thought on the right; stacks on phones. */
:root {
  --bg: #eceff4;
  --paper: #f8f9fb;
  --ink: #18202e;
  --muted: #5a6478;
  --rule: #cfd5e0;
  --accent: #2446c9;
  --accent-soft: rgba(36, 70, 201, 0.12);
  --philo: #18202e;
  --quad-a: rgba(36, 70, 201, 0.05);
  --quad-b: rgba(24, 32, 46, 0.035);
  --f-display: "Gloock", "Georgia", serif;
  --f-body: "Source Serif 4", "Georgia", "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151d; --paper: #181e29; --ink: #e4e8f0; --muted: #98a2b6; --rule: #2c3445;
    --accent: #7d97ff; --accent-soft: rgba(125, 151, 255, 0.16); --philo: #e4e8f0;
    --quad-a: rgba(125, 151, 255, 0.07); --quad-b: rgba(228, 232, 240, 0.03);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151d; --paper: #181e29; --ink: #e4e8f0; --muted: #98a2b6; --rule: #2c3445;
  --accent: #7d97ff; --accent-soft: rgba(125, 151, 255, 0.16); --philo: #e4e8f0;
  --quad-a: rgba(125, 151, 255, 0.07); --quad-b: rgba(228, 232, 240, 0.03);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  padding-inline: 20px; padding-block: 28px 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 28px; }
header { display: grid; gap: 8px; }
.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(34px, 5vw, 52px); line-height: 1.05; margin: 0; text-wrap: balance; max-width: 22ch; }
.lede { margin: 0; color: var(--muted); max-width: 68ch; }

.lang { display: inline-flex; border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; background: var(--paper); }
.lang button {
  border: 0; border-radius: 0; padding: 7px 12px; min-width: 44px;
  font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.08em;
  background: transparent; color: var(--muted); cursor: pointer;
}
.lang button + button { border-left: 1px solid var(--rule); }
.lang button:hover { color: var(--ink); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 880px) { .grid { grid-template-columns: minmax(0, 1fr); } .chart-col { order: -1; } }

.chart-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 14px; }
@media (max-width: 880px) { .chart-col { position: static; } }
.chart { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 8px; }
.chart svg { display: block; width: 100%; height: auto; }
svg text { font-family: var(--f-mono); }
.philo-dot { cursor: pointer; }
.philo-dot:focus { outline: none; }
.philo-dot:focus circle.hit, .philo-dot:hover circle.hit { stroke: var(--accent); stroke-width: 2; }
.philo-dot.active circle.core { fill: var(--accent); }

.info { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 18px; display: grid; gap: 6px; min-height: 124px; }
.info h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.info .coords { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.info p { margin: 0; }

.quiz { display: grid; gap: 28px; }
fieldset.section { border: 0; padding: 0; margin: 0; display: grid; gap: 14px; min-width: 0; }
.section-head { display: grid; gap: 2px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.section-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; }
.section-head span { color: var(--muted); font-size: 15px; }

.q { display: grid; gap: 10px; padding-block: 6px 10px; }
.q p { margin: 0; max-width: 62ch; }
.q .num { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.scale input { position: absolute; opacity: 0; pointer-events: none; }
.scale label {
  display: grid; place-items: center; text-align: center;
  font-family: var(--f-mono); font-size: 11px; line-height: 1.25; color: var(--muted);
  border: 1px solid var(--rule); border-radius: 4px; padding: 8px 4px; min-height: 48px;
  cursor: pointer; background: var(--paper); transition: background .15s, border-color .15s, color .15s;
  hyphens: auto; overflow-wrap: anywhere;
}
.scale label:hover { border-color: var(--accent); color: var(--ink); }
.scale input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.scale input:checked + label { background: var(--accent); border-color: var(--accent); color: var(--paper); }

.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.progress { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns button {
  font-family: var(--f-mono); font-size: 13px; letter-spacing: 0.04em;
  border: 1px solid var(--ink); background: transparent; color: var(--ink);
  padding: 9px 14px; border-radius: 4px; cursor: pointer;
}
.btns button.primary { background: var(--ink); color: var(--bg); }
.btns button:hover { border-color: var(--accent); }
.btns button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.result { background: var(--accent-soft); border-radius: 6px; padding: 16px 18px; display: grid; gap: 6px; }
.result h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; }
.result p { margin: 0; }
.result .coords { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.note { font-size: 14px; color: var(--muted); max-width: 68ch; margin: 0; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (prefers-reduced-motion: no-preference) {
  #you { transition: transform .45s cubic-bezier(.2,.7,.2,1); }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="top">
      <span class="eyebrow" id="t-eyebrow"></span>
      <div class="lang" role="group" aria-label="Language / Sprache / Idioma">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="de" lang="de">DE</button>
        <button type="button" data-lang="es" lang="es">ES</button>
      </div>
    </div>
    <h1 id="t-h1"></h1>
    <p class="lede" id="t-lede"></p>
  </header>

  <div class="grid">
    <form class="quiz" id="quiz" novalidate>
      <div id="sections"></div>

      <div class="bar">
        <span class="progress" id="progress"></span>
        <div class="btns">
          <button type="button" id="reset"></button>
          <button type="submit" class="primary" id="show"></button>
        </div>
      </div>

      <div class="result" id="result" hidden>
        <h3 id="res-title"></h3>
        <p class="coords" id="res-coords"></p>
        <p id="res-text"></p>
      </div>

      <p class="note" id="t-note"></p>
    </form>

    <aside class="chart-col">
      <div class="chart">
        <svg id="chart" viewBox="0 0 480 480" role="img" aria-labelledby="chart-title">
          <title id="chart-title"></title>
        </svg>
      </div>
      <div class="info" id="info" aria-live="polite">
        <h3 id="info-name"></h3>
        <span class="coords" id="info-coords"></span>
        <p id="info-text"></p>
      </div>
    </aside>
  </div>
</div>

        confucius: ["Confucio", "Evita la metafísica abstracta y se centra en la práctica vivida. El conocimiento y la moral se demuestran en la conducta fiable (xin) y en el respeto de las relaciones sociales y los ritos (li)."],
        sartre: ["Sartre", "La existencia precede a la esencia. No hay una naturaleza humana dada; los valores y el sentido surgen solo de la libre elección del individuo en su situación concreta."],
        beauvoir: ["Beauvoir", "Existencialista como Sartre: no se nace con una esencia fija, sino que se llega a ser quien se es. La libertad siempre está situada en condiciones corporales y sociales concretas."],
        zizek: ["Žižek", "Se define como materialista dialéctico. La realidad no es armónica ni cerrada, sino que está atravesada por una grieta y una contradicción internas: lo Real lacaniano."]
      }
    }
  };

  // ================= Model =================
  // Axis X: +10 = objectivism, -10 = relativism.  Axis Y: +10 = idealism/essence, -10 = materialism/existence.
  const PHILOSOPHERS = [
    { id: "plato", x: 8.5, y: 8.5, lx: -10, ly: 18, anchor: "end" },
    { id: "kant", x: -1.5, y: 5, lx: 0, ly: -12, anchor: "middle" },
    { id: "confucius", x: 3.5, y: -3, lx: 10, ly: 4, anchor: "start" },
    { id: "sartre", x: -6.5, y: -5.5, lx: -10, ly: 4, anchor: "end" },
    { id: "beauvoir", x: -5, y: -7.5, lx: -10, ly: 10, anchor: "end" },
    { id: "zizek", x: -2, y: -8.5, lx: 10, ly: 4, anchor: "start" }
  ];
  // d: +1 = agreeing pushes toward objectivism / idealism, -1 = toward relativism / materialism
  const SECTIONS = [
    { axis: "x", dirs: [1, -1, 1, -1, 1, -1] },
    { axis: "y", dirs: [1, 1, -1, -1, 1, -1] }
  ];

  const STORE_ANS = "philosophy-compass-answers";
  const STORE_LANG = "philosophy-compass-lang";
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  let lang = store.get(STORE_LANG);
  if (!T[lang]) {
    const nav = (navigator.language || "en").slice(0, 2).toLowerCase();
    lang = T[nav] ? nav : "en";
  }
  let resultMode = null; // null | "ok" | "insufficient"
  let activePhilo = null;

  // ================= Chart =================
  const NS = "http://www.w3.org/2000/svg";
  const C = 240, S = 19; // center and px per unit (±10 → 50..430)
  const px = x => C + x * S, py = y => C - y * S;
  const svg = document.getElementById("chart");
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(n);
    return n;
  };

  el("rect", { x: 240, y: 50, width: 190, height: 190, fill: "var(--quad-a)" });
  el("rect", { x: 50, y: 240, width: 190, height: 190, fill: "var(--quad-a)" });
  el("rect", { x: 50, y: 50, width: 190, height: 190, fill: "var(--quad-b)" });
  el("rect", { x: 240, y: 240, width: 190, height: 190, fill: "var(--quad-b)" });
  for (let i = -10; i <= 10; i += 5) {
    if (i === 0) continue;
    el("line", { x1: px(i), y1: 50, x2: px(i), y2: 430, stroke: "var(--rule)", "stroke-width": 1, "stroke-dasharray": "2 4" });
    el("line", { x1: 50, y1: py(i), x2: 430, y2: py(i), stroke: "var(--rule)", "stroke-width": 1, "stroke-dasharray": "2 4" });
  }
  el("rect", { x: 50, y: 50, width: 380, height: 380, fill: "none", stroke: "var(--rule)", "stroke-width": 1 });
  el("line", { x1: 50, y1: 240, x2: 430, y2: 240, stroke: "var(--muted)", "stroke-width": 1.2 });
  el("line", { x1: 240, y1: 50, x2: 240, y2: 430, stroke: "var(--muted)", "stroke-width": 1.2 });

  const axisLabel = (x, y, rot) => {
    const t = el("text", { x, y, "text-anchor": "middle", "font-size": 11, fill: "var(--ink)", "letter-spacing": "0.1em" });
    if (rot) t.setAttribute("transform", `rotate(${rot} ${x} ${y})`);
    return t;
  };
  const axisEls = { top: axisLabel(240, 36), bottom: axisLabel(240, 454), left: axisLabel(32, 240, -90), right: axisLabel(448, 240, 90) };

  const quadLabel = (x, y, anchor) => el("text", { x, y, "text-anchor": anchor, "font-size": 9.5, fill: "var(--muted)", "font-style": "italic" });
  const quadEls = { tl: quadLabel(58, 66, "start"), tr: quadLabel(422, 66, "end"), bl: quadLabel(58, 422, "start"), br: quadLabel(422, 422, "end") };

  const info = { name: document.getElementById("info-name"), coords: document.getElementById("info-coords"), text: document.getElementById("info-text") };
  const nodes = {};
  PHILOSOPHERS.forEach(p => {
    const g = el("g", { class: "philo-dot", tabindex: 0, role: "button" });
    el("circle", { class: "hit", cx: px(p.x), cy: py(p.y), r: 9, fill: "transparent", stroke: "transparent" }, g);
    el("circle", { class: "core", cx: px(p.x), cy: py(p.y), r: 5, fill: "var(--philo)" }, g);
    const label = el("text", { x: px(p.x) + p.lx, y: py(p.y) + p.ly, "text-anchor": p.anchor, "font-size": 11.5, fill: "var(--ink)", "font-weight": 500 }, g);
    const pick = () => { activePhilo = p.id; renderInfo(); };
    g.addEventListener("click", pick);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    nodes[p.id] = { g, label, p };
  });

  const you = el("g", { id: "you", style: "transform: translate(240px,240px)" });
  el("circle", { r: 14, fill: "var(--accent-soft)" }, you);
  el("circle", { r: 7, fill: "var(--accent)", stroke: "var(--paper)", "stroke-width": 2 }, you);
  const youTxt = el("text", { x: 0, y: -18, "text-anchor": "middle", "font-size": 12, fill: "var(--accent)", "font-weight": 500 }, you);
  you.style.display = "none";

  // ================= Questionnaire (built once, texts filled per language) =================
  const host = document.getElementById("sections");
  const qEls = []; // { text, labels[] }
  const secEls = [];
  let n = 0;
  SECTIONS.forEach(sec => {
    const fs = document.createElement("fieldset");
    fs.className = "section";
    const head = document.createElement("div");
    head.className = "section-head";
    const h2 = document.createElement("h2");
    const sub = document.createElement("span");
    head.append(h2, sub);
    fs.appendChild(head);
    secEls.push({ h2, sub });
    sec.ids = [];
    sec.dirs.forEach(() => {
      n++;
      const id = "q" + n;
      sec.ids.push(id);
      const q = document.createElement("div");
      q.className = "q";
      q.setAttribute("role", "radiogroup");
      q.setAttribute("aria-labelledby", id + "-t");
      const p = document.createElement("p");
      p.id = id + "-t";
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = String(n).padStart(2, "0");
      const txt = document.createElement("span");
      p.append(num, txt);
      const scale = document.createElement("div");
      scale.className = "scale";
      const labels = [];
      for (let i = 0; i < 5; i++) {
        const inp = document.createElement("input");
        inp.type = "radio"; inp.name = id; inp.id = `${id}-${i}`; inp.value = String(i - 2);
        const lab = document.createElement("label");
        lab.htmlFor = inp.id;
        scale.append(inp, lab);
        labels.push(lab);
      }
      q.append(p, scale);
      fs.appendChild(q);
      qEls.push({ txt, labels });
    });
    host.appendChild(fs);
  });

  const form = document.getElementById("quiz");
  const progress = document.getElementById("progress");
  const result = document.getElementById("result");
  const $ = id => document.getElementById(id);

  const fmt = v => {
    const s = new Intl.NumberFormat(lang, { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(Math.abs(v));
    return (v > 0.05 ? "+" : v < -0.05 ? "−" : "±") + s;
  };
  const num1 = v => new Intl.NumberFormat(lang, { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(v);

  function score() {
    const out = { x: null, y: null, answered: 0 };
    SECTIONS.forEach(sec => {
      let sum = 0, cnt = 0;
      sec.ids.forEach((id, i) => {
        const c = form.querySelector(`input[name="${id}"]:checked`);
        if (c) { sum += Number(c.value) * sec.dirs[i]; cnt++; }
      });
      out.answered += cnt;
      if (cnt) out[sec.axis] = (sum / cnt) * 5; // mean in [-2,2] → [-10,10]
    });
    return out;
  }

  const quadKey = (x, y) =>
    (Math.abs(x) < 1.5 ? "bal" : x > 0 ? "obj" : "rel") + "-" + (Math.abs(y) < 1.5 ? "mid" : y > 0 ? "ide" : "mat");

  function renderInfo() {
    const L = T[lang];
    Object.values(nodes).forEach(nd => nd.g.classList.toggle("active", nd.p.id === activePhilo));
    if (!activePhilo) {
      info.name.textContent = L.infoName;
      info.coords.textContent = L.infoCoords;
      info.text.textContent = L.infoText;
      return;
    }
    const nd = nodes[activePhilo];
    info.name.textContent = L.philo[activePhilo][0];
    info.coords.textContent = `x ${fmt(nd.p.x)} · y ${fmt(nd.p.y)}`;
    info.text.textContent = L.philo[activePhilo][1];
  }

  function update() {
    const L = T[lang];
    const s = score();
    progress.textContent = L.progress(s.answered);
    const placed = s.x !== null && s.y !== null;
    you.style.display = placed ? "" : "none";
    if (placed) you.style.transform = `translate(${px(s.x)}px, ${py(s.y)}px)`;

    if (resultMode && placed) resultMode = "ok";
    if (resultMode === "ok" && !placed) resultMode = null;

    if (resultMode === "ok") {
      const ranked = PHILOSOPHERS.map(p => ({ p, d: Math.hypot(p.x - s.x, p.y - s.y) })).sort((a, b) => a.d - b.d);
      $("res-title").textContent = L.quadName[quadKey(s.x, s.y)];
      $("res-coords").textContent = L.resCoords(fmt(s.x), fmt(s.y));
      $("res-text").textContent =
        L.resNearest(L.philo[ranked[0].p.id][0], num1(ranked[0].d), L.philo[ranked[1].p.id][0], num1(ranked[1].d)) +
        (s.answered < 12 ? L.resPartial(s.answered) : "");
      result.hidden = false;
    } else if (resultMode === "insufficient") {
      $("res-title").textContent = L.notEnoughTitle;
      $("res-coords").textContent = "";
      $("res-text").textContent = L.notEnoughText;
      result.hidden = false;
    } else {
      result.hidden = true;
    }
  }

  function applyLang() {
    const L = T[lang];
    document.documentElement.lang = lang;
    document.title = { en: "Philosophy Compass", de: "Philosophie-Kompass", es: "Brújula filosófica" }[lang];
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    $("t-eyebrow").textContent = L.eyebrow;
    $("t-h1").textContent = L.h1;
    $("t-lede").textContent = L.lede;
    $("t-note").textContent = L.note;
    $("reset").textContent = L.reset;
    $("show").textContent = L.show;
    $("chart-title").textContent = L.chartTitle;
    secEls.forEach((s, i) => { s.h2.textContent = L.sections[i].title; s.sub.textContent = L.sections[i].sub; });
    qEls.forEach((q, i) => {
      q.txt.textContent = L.questions[i];
      q.labels.forEach((lab, j) => (lab.textContent = L.likert[j]));
    });
    for (const k in axisEls) axisEls[k].textContent = L.axes[k];
    for (const k in quadEls) quadEls[k].textContent = L.quads[k];
    Object.values(nodes).forEach(nd => {
      nd.label.textContent = L.philo[nd.p.id][0];
      nd.g.setAttribute("aria-label", L.philo[nd.p.id][0]);
    });
    youTxt.textContent = L.you;
    renderInfo();
    update();
  }

  // ================= Events =================
  document.querySelectorAll(".lang button").forEach(b =>
    b.addEventListener("click", () => { lang = b.dataset.lang; store.set(STORE_LANG, lang); applyLang(); })
  );
  form.addEventListener("change", () => { update(); saveAnswers(); });
  form.addEventListener("submit", e => {
    e.preventDefault();
    const s = score();
    resultMode = s.x !== null && s.y !== null ? "ok" : "insufficient";
    update();
  });
  $("reset").addEventListener("click", () => {
    form.querySelectorAll("input[type=radio]").forEach(r => (r.checked = false));
    resultMode = null;
    update(); saveAnswers();
  });

  function saveAnswers() {
    const a = {};
    form.querySelectorAll("input:checked").forEach(r => (a[r.name] = r.value));
    store.set(STORE_ANS, JSON.stringify(a));
  }
  try {
    const a = JSON.parse(store.get(STORE_ANS) || "{}");
    Object.entries(a).forEach(([k, v]) => {
      const r = form.querySelector(`input[name="${k}"][value="${v}"]`);
      if (r) r.checked = true;
    });
  } catch (e) {}

  applyLang();
})();
</script>
</body>
</html>
